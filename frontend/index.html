<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bili Pet - 管理面板</title>
    <meta
      name="description"
      content="Bili Pet 管理面板，用于查看系统概览、任务管理、B站集成、审计日志与运营配置状态。"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
    />
    <!-- Font fallback metrics (Round-2 RC-8): local Arial-based fallback faces with
         size-adjust/ascent-override approximating Plus Jakarta Sans & Space Grotesk
         metrics, so slow-network font swap causes minimal CLS. display=swap is set
         on the Google Fonts link above. -->
    <style>
      @font-face {
        font-family: 'Plus Jakarta Sans Fallback';
        src: local('Arial');
        size-adjust: 107%;
        ascent-override: 102%;
        descent-override: 22%;
        line-gap-override: 0%;
      }
      @font-face {
        font-family: 'Space Grotesk Fallback';
        src: local('Arial');
        size-adjust: 105%;
        ascent-override: 100%;
        descent-override: 22%;
        line-gap-override: 0%;
      }
    </style>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%234808d1'/%3E%3Cpath d='M18 22h18c8 0 14 6 14 14s-6 14-14 14H18z' fill='%23fff'/%3E%3Cpath d='M24 28h11c4 0 7 3 7 8s-3 8-7 8H24z' fill='%234808d1'/%3E%3Ccircle cx='21' cy='18' r='3' fill='%23fff'/%3E%3Ccircle cx='43' cy='18' r='3' fill='%23fff'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
